<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigin-up-form</title>
    <link rel="stylesheet" href="main.css">
    <script src="js.js" defer></script>
</head>

<body>
    <div class="container">
        <div class="left_body">
            <div class="left_body_text">
                <p>Happy New Year!</p>
            </div>
        </div>
        <div class="right_body">
            <div class="handler">
                <header class="right_body_el">
                    <h1>Happy New Year!</h1>
                    <p>I wish you happiness, health and fulfillment of all desires! May this year be
                        full of smiles and kindness!</p>
                </header>
                <!-- <form action="" method="post"> -->
                <main class="right_body_el">
                    <h2>Let's do this!</h2>
                    <p class="login_p">Log In</p>
                    <p class="sigin_p">Sign In</p>
                    <div class="main_content">
                        <div>
                            <label for="first_name">First name:</label>
                            <input type="text" name="first_name" id="first_name">
                        </div>

                        <div>
                            <label for="last_name">Last name:</label>
                            <input type="text" name="last_name" id="last_name">
                        </div>

                        <div>
                            <label for="email">Email:</label>
                            <input type="email" name="email" id="email">
                        </div>

                        <div>
                            <label for="phone">Phone number:</label>
                            <input type="tel" name="phone" id="phone">
                        </div>

                        <div>
                            <label for="password">password:</label>
                            <input type="password" minlength="8" name="password" id="password" required>
                        </div>

                        <div>
                            <label for="confirm_password" class="confirm_password">confirm password:</label>
                            <input type="confirm_password" name="confirm_password" id="confirm_password" required>
                        </div>

                    </div>
                </main>
                <footer class="right_body_el">
                    <button id="btn">Create Account</button>
                    <p>Already have an account? <span id="siginin" style="color: green;">Sigin in</span> <span id="back"
                            style="color: red;">Go back to log in</span>
                    </p>
                </footer>
                <!-- </form> -->
            </div>
            <div class="handler_2">
                <div class="handler_2_content">
                    <p>Welcome <span id="user_name" style="color: red;">men</span></p>
                    <p>Happe new year!</p>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
